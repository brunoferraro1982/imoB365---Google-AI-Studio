title = "imoB365 gitleaks config"

[extend]
useDefault = true

# Falsos positivos confirmados manualmente — não desativa nenhuma regra,
# só ignora achados específicos já revisados.
[allowlist]
description = "Falsos positivos confirmados"
# Por VALOR (não por commit): o data-key do Ahrefs Web Analytics
# (PSbPYvE9hFaWKmvrPzDhrg) é um identificador público de rastreamento —
# a própria Ahrefs manda colar direto no HTML do site, não é segredo — mas
# dispara a regra generic-api-key (string alfanumérica de alta entropia
# atribuída a algo chamado "key"). Allowlist por SHA de commit não é
# suficiente aqui: PRs pra develop são squash-merged, o commit squashed tem
# um SHA novo com o mesmo conteúdo e voltaria a disparar na PR seguinte
# (mesma causa do incidente de signupIntent.ts abaixo, evitada desta vez
# allowlistando o valor exato em vez do commit).
regexes = [
  '''PSbPYvE9hFaWKmvrPzDhrg''',
]
commits = [
  # src/lib/signupIntent.ts:6 — constante local com o nome de um item de
  # localStorage, não um segredo; disparava a regra generic-api-key pelo
  # nome curto da variável original. Renomeada em 2cbc1e6, mas o commit
  # original permanece no histórico da PR e o scan disparado pelo evento
  # pull_request re-escaneia o range inteiro de commits.
  "05c7b9f9df04154f0b5ae5776bd932033a33ef30",
  # CLAUDE.md:504 (na época) — mesmo falso positivo acima, reproduzido
  # literalmente na prosa do changelog explicando o achado (corrigido
  # depois pra descrever sem citar o trecho verbatim, ver nota no próprio
  # changelog "para quem editar este arquivo no futuro").
  "75161f384f66bdd14badb998eed99e7a6435abd9",
]
